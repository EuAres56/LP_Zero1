<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vitrine de Produtos</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            padding: 20px;
            text-align: center;
            background: #111;
            color: #fff;
        }

        main {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, .08);
            display: flex;
            flex-direction: column;
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #eee;
        }

        .card-body {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .card h3 {
            margin: 0;
            font-size: 16px;
        }

        .price {
            font-weight: bold;
            font-size: 18px;
            color: #0a7;
            margin-top: auto;
        }

        .loading,
        .error {
            text-align: center;
            font-size: 18px;
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <header>
        <h1>Nossos Produtos</h1>
        <p>Confira nossa vitrine</p>
    </header>

    <main>
        <div id="status" class="loading">Carregando produtos...</div>
        <section id="produtos" class="grid"></section>
    </main>

    <script>
        // 🔁 SUBSTITUA PELA URL DA SUA PLANILHA PUBLICADA EM CSV
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQXtypDX-PBtHQgWfAPNAoCFb_dAw__otSTERCAL3R2pgi_br2WV7UC1d7PaZ9kfEahfLuh6f3ocNL9/pub?gid=0&single=true&output=csv'

        const statusEl = document.getElementById('status')
        const produtosEl = document.getElementById('produtos')

        fetch(SHEET_URL)
            .then(res => res.text())
            .then(csv => {
                const linhas = csv.trim().split('\n')
                const cabecalho = linhas.shift().split(',')

                let exibiuAlgo = false

                linhas.forEach(linha => {
                    const dados = linha.split(',')

                    const item = {}
                    cabecalho.forEach((col, i) => {
                        item[col.trim()] = dados[i]
                            ?.trim()
                            .replace(/^"|"$/g, '')   // remove aspas no início/fim
                    })

                    const estoque = Number(item.estoque)
                    if (estoque <= 0) return

                    exibiuAlgo = true

                    const preco = Number(item.Valor).toFixed(2).replace('.', ',')

                    const card = document.createElement('article')
                    card.className = 'card'

                    card.innerHTML = `
            <img src="${item.Imagem}" alt="${item.Produto}">
            <div class="card-body">
              <h3>${item.Produto}</h3>
              <div class="price">R$ ${preco}</div>
            </div>
          `

                    produtosEl.appendChild(card)
                })

                statusEl.style.display = 'none'

                if (!exibiuAlgo) {
                    statusEl.textContent = 'Nenhum produto disponível no momento.'
                    statusEl.style.display = 'block'
                }
            })
            .catch(err => {
                console.error(err)
                statusEl.textContent = 'Erro ao carregar os produtos.'
                statusEl.className = 'error'
            })
    </script>

</body>

</html>
