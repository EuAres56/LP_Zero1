<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vitrine de Produtos</title>
    <link rel="stylesheet" href="../CSS/catalogo.css" />

</head>

<body>

    <header>
        <div class="hero-logo">
            <img id="img_logo_1" src="..\SRC\Logo_zero1.png" alt="Zero1">
            <img id="img_logo_2" src="..\SRC\Logo.png" alt="Zero1">
        </div>


        <p class="hero-subtitle">Tecnologia, design e performance</p>

        <div class="filters">
            <input type="text" id="search" placeholder="Buscar produto..." />
            <div class="custom-select" id="categorySelect">
                <div class="selected">Todas as categorias</div>
                <ul class="options"></ul>
            </div>


            <!-- select invisível (mantém compatibilidade e lógica) -->
            <select id="category" hidden>
                <option value="">Todas as categorias</option>
            </select>
        </div>
    </header>

    <main>
        <div id="status" class="loading">Carregando produtos...</div>
        <section id="produtos" class="grid"></section>
    </main>

    <script>
        const SHEET_URL =
            'https://docs.google.com/spreadsheets/d/e/2PACX-1vQXtypDX-PBtHQgWfAPNAoCFb_dAw__otSTERCAL3R2pgi_br2WV7UC1d7PaZ9kfEahfLuh6f3ocNL9/pub?gid=0&single=true&output=csv'

        const statusEl = document.getElementById('status')
        const produtosEl = document.getElementById('produtos')
        const searchEl = document.getElementById('search')
        const categoryEl = document.getElementById('category')

        let produtos = []

        function parseCSV(text) {
            const linhas = []
            let linha = []
            let campo = ''
            let dentroAspas = false

            for (let i = 0; i < text.length; i++) {
                const char = text[i]
                const next = text[i + 1]

                if (char === '"' && dentroAspas && next === '"') {
                    campo += '"'
                    i++
                } else if (char === '"') {
                    dentroAspas = !dentroAspas
                } else if (char === ',' && !dentroAspas) {
                    linha.push(campo)
                    campo = ''
                } else if (char === '\n' && !dentroAspas) {
                    linha.push(campo)
                    linhas.push(linha)
                    linha = []
                    campo = ''
                } else {
                    campo += char
                }
            }

            if (campo) linha.push(campo)
            if (linha.length) linhas.push(linha)
            return linhas
        }

        function render() {
            produtosEl.innerHTML = ''

            const termo = searchEl.value.toLowerCase()
            const categoria = categoryEl.value

            const filtrados = produtos.filter(p => {
                const nomeMatch = p.Produto.toLowerCase().includes(termo)
                const categoriaMatch = !categoria || p.Categoria === categoria
                return nomeMatch && categoriaMatch
            })

            if (!filtrados.length) {
                statusEl.style.display = 'block'
                statusEl.textContent = 'Nenhum produto encontrado.'
                return
            }

            statusEl.style.display = 'none'

            filtrados.forEach(item => {
                const preco = Number(item.Valor).toFixed(2).replace('.', ',')

                const card = document.createElement('article')
                card.className = 'card'

                const img = document.createElement('img')
                img.src = encodeURI(item.Imagem)
                img.alt = item.Produto
                img.loading = 'lazy'

                const body = document.createElement('div')
                body.className = 'card-body'

                const msg = encodeURIComponent(
                    `Olá, tenho interesse no produto: ${item.Produto}`
                )

                body.innerHTML = `
          <h3>${item.Produto}</h3>
          <div class="price">R$ ${preco}</div>
          <a class="buy" target="_blank"
             href="https://wa.me/5574981008585?text=${msg}">
            Comprar no WhatsApp
          </a>
        `

                card.appendChild(img)
                card.appendChild(body)
                produtosEl.appendChild(card)
            })
        }

        fetch(SHEET_URL)
            .then(res => res.text())
            .then(csv => {
                const linhas = parseCSV(csv.trim())
                const cabecalho = linhas.shift()

                const categorias = new Set()

                linhas.forEach(dados => {
                    const item = {}
                    cabecalho.forEach((col, i) => {
                        item[col.trim()] = (dados[i] || '').replace(/^"|"$/g, '').trim()
                    })

                    if (Number(item.Estoque) <= 0) return

                    produtos.push(item)
                    categorias.add(item.Categoria)
                })

                categorias.forEach(cat => {
                    const opt = document.createElement('option')
                    opt.value = cat
                    opt.textContent = cat
                    categoryEl.appendChild(opt)
                })

                syncCustomCategories()
                render()
            })
            .catch(() => {
                statusEl.textContent = 'Erro ao carregar produtos.'
                statusEl.className = 'error'
            })

        searchEl.addEventListener('input', render)
        categoryEl.addEventListener('change', render)


        const customSelect = document.getElementById('categorySelect')
        const selectedEl = customSelect.querySelector('.selected')
        const optionsEl = customSelect.querySelector('.options')

        // abre / fecha
        selectedEl.addEventListener('click', () => {
            customSelect.classList.toggle('open')
        })

        // fecha ao clicar fora
        document.addEventListener('click', e => {
            if (!customSelect.contains(e.target)) {
                customSelect.classList.remove('open')
            }
        })

        // popula dropdown custom quando categorias forem carregadas
        function syncCustomCategories() {
            optionsEl.innerHTML = ''

            const options = [...categoryEl.options]

            options.forEach(opt => {
                const li = document.createElement('li')
                li.textContent = opt.textContent
                li.dataset.value = opt.value

                if (opt.selected) li.classList.add('active')

                li.addEventListener('click', () => {
                    categoryEl.value = opt.value
                    selectedEl.textContent = opt.textContent

                    optionsEl.querySelectorAll('li').forEach(i =>
                        i.classList.remove('active')
                    )
                    li.classList.add('active')

                    customSelect.classList.remove('open')
                    render()
                })

                optionsEl.appendChild(li)
            })
        }
    </script>


</body>

</html>
